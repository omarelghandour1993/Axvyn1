<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Axvyn SRT Translator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 30px;
    }
    h1 {
      text-align: center;
      margin-bottom: 10px;
    }
    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-top: 18px;
      margin-bottom: 6px;
      font-size: 13px;
    }
    input, select, button {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    button {
      margin-top: 18px;
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #005ec2;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .msg {
      display: none;
      margin-top: 16px;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
    }
    .msg.show {
      display: block;
    }
    .msg.error {
      background: #ffe5e5;
      border: 1px solid #e8b9b9;
      color: #9d0000;
    }
    .msg.success {
      background: #eafaf0;
      border: 1px solid #bfe7c6;
      color: #0d6f2a;
    }
    .footer {
      text-align: center;
      font-size: 12px;
      color: #777;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Axvyn SRT Translator</h1>
    <p class="subtitle">Free translation using LibreTranslate</p>

    <label for="srtFile">Select SRT file</label>
    <input id="srtFile" type="file" accept=".srt" />

    <label for="sourceLanguage">Subtitle language</label>
    <select id="sourceLanguage">
      <option value="ar" selected>Arabic</option>
      <option value="en">English</option>
      <option value="es">Spanish</option>
      <option value="fr">French</option>
      <option value="de">German</option>
      <option value="pt">Portuguese</option>
      <option value="ru">Russian</option>
      <option value="zh">Chinese</option>
      <option value="hi">Hindi</option>
      <option value="ja">Japanese</option>
      <option value="ko">Korean</option>
      <option value="it">Italian</option>
      <option value="nl">Dutch</option>
      <option value="pl">Polish</option>
      <option value="tr">Turkish</option>
    </select>

    <label for="targetLanguage">Translate to</label>
    <select id="targetLanguage">
      <option value="en" selected>English</option>
      <option value="ar">Arabic</option>
      <option value="es">Spanish</option>
      <option value="fr">French</option>
      <option value="de">German</option>
      <option value="pt">Portuguese</option>
      <option value="ru">Russian</option>
      <option value="zh">Chinese</option>
      <option value="hi">Hindi</option>
      <option value="ja">Japanese</option>
      <option value="ko">Korean</option>
      <option value="it">Italian</option>
      <option value="nl">Dutch</option>
      <option value="pl">Polish</option>
      <option value="tr">Turkish</option>
    </select>

    <button id="translateBtn" type="button">Translate & Download</button>

    <div id="message" class="msg"></div>

    <div class="footer">© 2024 Axvyn</div>
  </div>

  <script>
    const button = document.getElementById('translateBtn');
    const msg = document.getElementById('message');

    function showMessage(text, isError) {
      msg.textContent = text;
      msg.className = 'msg show ' + (isError ? 'error' : 'success');
    }

    function setBusy(isBusy) {
      button.disabled = isBusy;
      button.textContent = isBusy ? 'Translating...' : 'Translate & Download';
    }

    async function translateSrt() {
      const file = document.getElementById('srtFile').files[0];

      if (!file) {
        showMessage('Please choose an SRT file first.', true);
        return;
      }

      if (!file.name.toLowerCase().endsWith('.srt')) {
        showMessage('Please choose a valid .srt file.', true);
        return;
      }

      if (file.size > 5 * 1024 * 1024) {
        showMessage('The maximum file size is 5 MB.', true);
        return;
      }

      const sourceLanguage = document.getElementById('sourceLanguage').value;
      const targetLanguage = document.getElementById('targetLanguage').value;

      if (sourceLanguage === targetLanguage) {
        showMessage('Choose different source and target languages.', true);
        return;
      }

      const formData = new FormData();
      formData.append('srtFile', file);
      formData.append('sourceLanguage', sourceLanguage);
      formData.append('targetLanguage', targetLanguage);

      setBusy(true);
      showMessage('Uploading and translating...', false);

      try {
        const response = await fetch('/api/translate-srt', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          throw new Error(data.error || 'Translation failed.');
        }

        const blob = await response.blob();
        const contentDisposition = response.headers.get('content-disposition') || '';
        let filename = file.name.replace(/\.srt$/i, '') + '_' + targetLanguage + '.srt';
        const match = contentDisposition.match(/filename="([^"]+)"/);

        if (match) {
          filename = match[1];
        }

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');

        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);

        showMessage('Translation complete. Downloaded ' + filename, false);
      } catch (error) {
        console.error(error);
        showMessage(error.message || 'Translation failed.', true);
      } finally {
        setBusy(false);
      }
    }

    document.getElementById('translateBtn').addEventListener('click', translateSrt);
  </script>
</body>
</html>
